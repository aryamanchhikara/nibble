[project]
name = "nibble-pet"
version = "0.1.0"
description = "A pixel-art desktop pet that lives on top of your windows (macOS)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aryaman Chhikara" }]
classifiers = [
    "Environment :: MacOS X :: Cocoa",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pyobjc-core>=12.2",
    "pyobjc-framework-Cocoa>=12.2",
    "pyobjc-framework-coretext>=12.2",
    "pyobjc-framework-Quartz>=12.2",
]

[project.scripts]
nibble = "nibble.cli:main"

[dependency-groups]
dev = [
    "py2app>=0.28.10",
    "pytest>=8",
    "setuptools>=84.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nibble"]

[tool.uv]
# Stick to uv-managed interpreters for development: it keeps Anaconda/Homebrew
# Pythons out of the venv. py2app can't bundle them, so scripts/build_dmg.sh
# builds the app with python.org's Python in its own environment instead.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
